name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q stellar_burgers tests

      - name: Verify test collection
        shell: bash
        run: |
          collection_output="$(python -m pytest --collect-only -q -p no:cacheprovider)"
          printf '%s\n' "$collection_output"
          grep -Eq '^22 tests collected in ' <<< "$collection_output"

      - name: Run tests with coverage
        run: >-
          python -m pytest
          -p no:cacheprovider
          --cov=stellar_burgers
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

